[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-agent"
version = "0.1.0"
description = "Protocol-first runtime for interruptible real-time agents"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.scripts]
relay-demo = "relay.demo:main"
relay-web = "relay.web:main"

[tool.setuptools.packages.find]
include = ["relay*"]
